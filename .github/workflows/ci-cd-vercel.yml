name: CI/CD Vercel

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  VERCEL_ORG_ID: team_Gl5TWD0bTPFShM7ufLH5zdCs
  VERCEL_PROJECT_ID: prj_fDbbQ32JaAaiC5mEBvh2fB0nUS4i
  VERCEL_SCOPE: stanley13

jobs:
  ci:
    name: Testes e validação
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar sintaxe principal
        run: |
          node --check server.js
          node --check src/routes/fixedStudyPlan.js
          node --check src/services/weeklyPlanSnapshot.js

      - name: Executar testes
        run: npm test

  deploy:
    name: Build no GitHub e deploy prebuilt
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar token da Vercel
        id: vercel-token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret VERCEL_TOKEN ainda não configurado. CI concluído, deploy ignorado."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Vercel CLI
        if: steps.vercel-token.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: Vincular projeto Vercel explicitamente
        if: steps.vercel-token.outputs.configured == 'true'
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          cat .vercel/project.json

      - name: Baixar configurações e variáveis de produção
        if: steps.vercel-token.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build de produção no runner do GitHub
        if: steps.vercel-token.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt em produção
        if: steps.vercel-token.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"
